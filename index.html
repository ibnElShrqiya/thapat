<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ef">
<title>ثبات — متتبع العادات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
:root{--bg:#f6f4ef;--surface:#fffefa;--ink:#242922;--muted:#77796f;--line:#e6e3da;--green:#285b48;--green-soft:#e5eee7;--ember:#b85e3d;--ember-soft:#f6e8df;--sea:#397a83;--olive:#77824c;--clay:#b9795d;--night:#4e5877;--wine:#87526a;--sand:#b19a68;--shadow:0 14px 38px #25291f0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.65}button,input,select{font:inherit}button{cursor:pointer;transition:.18s}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #82b5a0;outline-offset:2px}.app{max-width:1180px;margin:auto;padding:34px 24px 50px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{border-right:4px solid var(--green);padding-right:16px}.brand h1{font-family:Amiri,serif;font-size:54px;line-height:1;margin:0;font-weight:700;letter-spacing:-1px}.date{color:var(--muted);margin:10px 0 0;font-size:14px}.streak{display:flex;gap:9px;align-items:center;background:var(--ember-soft);color:#78402c;border-radius:999px;padding:10px 15px;font-weight:600;font-size:14px}.streak .flame{font-size:20px}.toolbar{display:flex;gap:12px;align-items:center;margin:28px 0 22px}.tabs{display:flex;background:#eeece5;border:1px solid var(--line);padding:4px;border-radius:999px;gap:3px}.tab{border:0;background:transparent;color:var(--muted);padding:10px 24px;border-radius:999px;font-weight:600}.tab.active{background:var(--green);color:white;box-shadow:0 3px 8px #285b4822}.primary{border:0;background:var(--green);color:white;padding:12px 20px;border-radius:999px;font-weight:600}.primary:hover{background:#1e4938;transform:translateY(-1px)}.toolbar .primary{margin-right:auto}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-head h2{font-size:19px;margin:0;font-weight:700}.subtle{color:var(--muted);font-size:13px}.habit-list{display:grid;gap:10px}.habit{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fffefa;min-width:0}.habit.done{background:#f3f7f1;border-color:#cbdacb}.dot{width:10px;height:42px;border-radius:9px;flex-shrink:0}.habit-info{min-width:0;flex:1}.habit-name{font-weight:600;overflow-wrap:anywhere}.habit-meta{font-size:12px;color:var(--muted);margin-top:2px}.check{width:38px;height:38px;border-radius:50%;border:1.5px solid #d2d2c8;background:white;color:transparent;display:grid;place-items:center;font-size:20px;flex-shrink:0}.done .check{background:var(--green);color:white;border-color:var(--green)}.icon-btn{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:10px;font-size:17px}.icon-btn:hover{background:#efeee8;color:var(--ink)}.empty{text-align:center;padding:42px 16px}.empty .leaf{font-size:34px;color:var(--green)}.empty h2{margin:8px 0}.empty p{max-width:360px;margin:8px auto 18px;color:var(--muted)}.stats{display:grid;gap:12px}.stat{border:1px solid var(--line);border-radius:17px;padding:16px;background:#fffefa}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-num{font-size:30px;font-weight:700;line-height:1.3;margin-top:8px}.stat-note{font-size:12px;color:var(--muted);margin-top:5px}.progress{height:7px;background:#e9e8df;border-radius:20px;overflow:hidden;margin-top:13px}.progress span{display:block;height:100%;background:var(--green);border-radius:20px;transition:width .25s}.stat-wide{background:var(--green-soft);border-color:#d8e5d8}.habit-stat-list{display:grid;gap:10px;margin-top:8px}.habit-stat{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;font-size:13px}.habit-stat .mini{height:28px;width:5px;border-radius:5px}.habit-stat strong{font-size:13px}.week-nav,.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.navbtn{border:1px solid var(--line);background:white;border-radius:11px;width:38px;height:38px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.day-card{border:1px solid var(--line);border-radius:14px;min-height:112px;padding:9px 5px;text-align:center;background:#fffefa;cursor:pointer}.day-card.today{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}.day-card.selected{background:var(--green-soft)}.day-name{font-size:12px;color:var(--muted)}.day-number{font-weight:700;font-size:17px;margin:4px 0 9px}.day-mark{width:8px;height:8px;border-radius:50%;background:#d7d8ce;display:inline-block;margin:1px}.day-mark.yes{background:var(--green)}.day-ratio{font-size:11px;color:var(--muted);margin-top:6px}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;font-size:12px;color:var(--muted);padding:6px 0}.month-day{min-height:62px;border:1px solid transparent;border-radius:11px;background:#f5f4ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.month-day.outside{opacity:.38}.month-day.today{border-color:var(--green)}.month-day.selected{background:var(--green-soft);border-color:#b9d0bf}.month-day .tinybar{width:22px;height:4px;border-radius:5px;background:#dedfd5}.month-day .tinybar.good{background:var(--green)}.focus-list{margin-top:20px;border-top:1px solid var(--line);padding-top:17px}.focus-row{display:flex;align-items:center;gap:10px;padding:9px 0}.focus-row .name{flex:1}.badge{font-size:12px;border-radius:999px;padding:4px 9px;background:#efeee8;color:var(--muted)}.demo-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;margin-top:20px;border-radius:15px;background:var(--ember-soft);font-size:13px}.demo-banner button{border:1px solid #e6c9b9;background:#fff8f3;border-radius:10px;padding:7px 12px}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:24px;color:var(--muted);font-size:12px}.footer button{border:0;background:none;color:var(--green);text-decoration:underline}.modal-backdrop{position:fixed;inset:0;background:#171b17a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.open{display:flex}.modal{width:min(100%,460px);background:var(--surface);border-radius:22px;padding:24px;box-shadow:0 24px 90px #0003}.modal h2{margin:0 0 18px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-weight:600;font-size:14px}.field input,.field select{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px;color:var(--ink)}.colors{display:flex;gap:9px;flex-wrap:wrap}.color-choice{width:31px;height:31px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px var(--line)}.color-choice.selected{box-shadow:0 0 0 2px var(--ink)}.modal-actions{display:flex;gap:9px;margin-top:22px}.modal-actions button{flex:1}.secondary{border:1px solid var(--line);background:white;color:var(--ink);padding:11px 15px;border-radius:12px;font-weight:600}.danger{color:#a33c32;background:#fff3f1;border:1px solid #f0d0cb;padding:11px 15px;border-radius:12px;font-weight:600}.modal-actions .danger{flex:0 0 auto}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#202a23;color:white;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:10;box-shadow:0 8px 24px #0002}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}
@media(max-width:820px){.app{padding:25px 16px 35px}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-wide,.habit-stat-box{grid-column:1/-1}.brand h1{font-size:46px}.panel{padding:17px}.toolbar{flex-wrap:wrap}.toolbar .primary{margin-right:0}.tab{padding:9px 20px}.day-card{min-height:100px}.week-grid{gap:4px}.day-card{padding:7px 2px}.day-name{font-size:11px}}
@media(max-width:480px){.app{padding:20px 12px 30px}.header{align-items:flex-start}.brand h1{font-size:42px}.date{font-size:12px}.streak{padding:8px 10px;font-size:12px;gap:5px}.toolbar{margin:22px 0 15px;gap:9px}.tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.tab{padding:9px 5px}.toolbar .primary{width:100%}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:12px}.stat-num{font-size:25px}.week-grid{gap:3px}.day-card{min-height:88px;border-radius:10px}.day-name{font-size:10px}.day-number{font-size:15px;margin:3px 0 6px}.day-mark{width:6px;height:6px}.day-ratio{font-size:10px}.month-day{min-height:48px}.footer{flex-direction:column}.habit{padding:12px 10px;gap:9px}.check{width:34px;height:34px}.demo-banner{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="app">
<header class="header"><div class="brand"><h1>ثبات</h1><p class="date" id="todayLabel"></p></div><div class="streak"><span class="flame">♨</span><span id="streakLabel">لا سلسلة بعد</span></div></header>
<div id="demoBanner" class="demo-banner hidden"><span>بيانات للتجربة فقط. امسحها وابدأ تسجيل عاداتك الحقيقية، أو احتفظ بها وعدّلها.</span><div style="display:flex;gap:7px"><button id="clearDemo">مسح الأمثلة</button><button id="keepDemo">إبقاؤها</button></div></div>
<div class="toolbar"><div class="tabs" role="tablist"><button class="tab active" data-view="today">اليوم</button><button class="tab" data-view="week">الأسبوع</button><button class="tab" data-view="month">الشهر</button></div><button class="primary" id="addBtn">＋ عادة جديدة</button></div>
<div class="layout"><section class="panel" id="mainPanel"></section><aside class="panel"><div class="section-head"><h2>ملخص الالتزام</h2><span>◷</span></div><div class="stats" id="stats"></div></aside></div>
<footer class="footer"><span>ثبات — خطوة صغيرة كل يوم تصنع فرقًا.</span><div><button id="exportBtn">تصدير نسخة احتياطية</button> · <button id="importBtn">استيراد بيانات</button> · <button id="resetBtn">مسح كل البيانات</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></footer>
</main>
<div class="modal-backdrop" id="modalBackdrop"><form class="modal" id="habitForm"><h2 id="modalTitle">إضافة عادة جديدة</h2><div class="field"><label for="habitName">اسم العادة</label><input id="habitName" maxlength="48" placeholder="مثال: قراءة عشرين دقيقة" required></div><div class="field"><label for="habitColor">لون العادة</label><div class="colors" id="colors"></div><input type="hidden" id="habitColor" value="cedar"></div><div class="modal-actions"><button class="primary" type="submit">حفظ العادة</button><button class="secondary" type="button" id="cancelModal">إلغاء</button><button class="danger hidden" type="button" id="deleteHabit">حذف</button></div></form></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const KEY='thabat.v1';const colors={cedar:'#4f795d',ember:'#b85e3d',clay:'#b9795d',sea:'#397a83',olive:'#77824c',night:'#4e5877',wine:'#87526a',sand:'#b19a68'};const colorNames={cedar:'أخضر',ember:'نحاسي',clay:'طيني',sea:'بحري',olive:'زيتوني',night:'ليلي',wine:'خمري',sand:'رملي'};const days=['سبت','أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة'];let state=load(),view='today',editing=null,selectedId=null,weekAnchor=new Date(),monthAnchor=new Date(),focusDate=new Date(),chosenColor='cedar',toastTimer;
const $=id=>document.getElementById(id);const today=()=>strip(new Date());const strip=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());const add=(d,n)=>{let x=strip(d);x.setDate(x.getDate()+n);return x};const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parse=k=>{let [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};const fmt=(d,opt={weekday:'long',day:'numeric',month:'long'})=>new Intl.DateTimeFormat('ar-EG',opt).format(d);const num=n=>new Intl.NumberFormat('ar-EG').format(n);const pct=n=>new Intl.NumberFormat('ar-EG',{style:'percent',maximumFractionDigits:0}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const active=(h,k)=>h.filter(x=>x.createdAt<=k);const done=(id,k)=>!!(state.logs[id]||[]).includes(k);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){showToast('تعذر الحفظ على هذا الجهاز')}};function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.habits)&&x.logs&&typeof x.logs==='object')return {habits:x.habits,logs:x.logs,demo:!!x.demo}}catch(e){}return {habits:[],logs:{},demo:false}}
function showToast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}function startWeek(d){return add(d,-((d.getDay()+1)%7))}function weekDays(d){let s=startWeek(d);return Array.from({length:7},(_,i)=>add(s,i))}function daysDone(h){return state.logs[h.id]||[]}function streakOf(dates){let set=new Set(dates),cur=set.has(key(today()))?today():add(today(),-1),n=0;if(!set.has(key(cur)))return 0;while(set.has(key(cur))&&n<20000){n++;cur=add(cur,-1)}return n}function bestStreak(dates){let a=[...new Set(dates)].sort(),best=0,run=0,last=null;for(let k of a){let d=parse(k);run=last&&Math.round((d-last)/86400000)===1?run+1:1;best=Math.max(best,run);last=d}return best}function commitmentDates(){if(!state.habits.length)return[];let earliest=state.habits.map(h=>h.createdAt).sort()[0],out=[];for(let d=parse(earliest);d<=today();d=add(d,1)){let k=key(d),a=active(state.habits,k);if(a.length&&a.every(h=>done(h.id,k)))out.push(k)}return out}function dayRatio(k){let a=active(state.habits,k);return a.length?a.filter(h=>done(h.id,k)).length/a.length:null}function currentStreak(){return streakOf(commitmentDates())}
function render(){ $('todayLabel').textContent=fmt(today());$('streakLabel').textContent=currentStreak()?`${num(currentStreak())} ${currentStreak()===1?'يوم متتالٍ':'أيام متتالية'}`:'لا سلسلة بعد';$('demoBanner').classList.toggle('hidden',!state.demo);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='today')renderToday();if(view==='week')renderWeek();if(view==='month')renderMonth();renderStats()}
function renderToday(){let k=key(today()),a=active(state.habits,k),completed=a.filter(h=>done(h.id,k)).length,ratio=a.length?completed/a.length:0;let html=`<div class="section-head"><div><h2>عادات اليوم</h2><div class="subtle">${fmt(today())}</div></div><span class="badge">${num(completed)} من ${num(a.length)}</span></div>`;if(!state.habits.length){html+=`<div class="empty"><div class="leaf">♧</div><h2>لا عادات بعد</h2><p>اختر عادة واحدة واضحة. الثبات يُبنى من يوم تُتمّه، لا من قائمة طويلة.</p><button class="primary" onclick="document.getElementById('addBtn').click()">＋ أضف عادتك الأولى</button></div>`}else{html+=`<div class="progress" style="margin:0 0 17px"><span style="width:${ratio*100}%"></span></div><div class="habit-list">${a.map(h=>habitRow(h,k)).join('')}</div>`} $('mainPanel').innerHTML=html}
function habitRow(h,k){let yes=done(h.id,k);return `<article class="habit ${yes?'done':''}"><span class="dot" style="background:${colors[h.color]||colors.cedar}"></span><div class="habit-info"><div class="habit-name">${esc(h.name)}</div><div class="habit-meta">${yes?'أُنجزت اليوم':'خطوة صغيرة نحو الثبات'}</div></div><button class="icon-btn" title="تعديل العادة" aria-label="تعديل ${esc(h.name)}" onclick="window.editHabit('${h.id}')">✎</button><button class="check" aria-label="${yes?'إلغاء الإنجاز':'تسجيل الإنجاز'}" onclick="window.toggleDone('${h.id}','${k}')">${yes?'✓':'✓'}</button></article>`}
function renderWeek(){let ds=weekDays(weekAnchor),label=`${fmt(ds[0],{day:'numeric',month:'short'})} — ${fmt(ds[6],{day:'numeric',month:'long',year:'numeric'})}`;let html=`<div class="week-nav"><button class="navbtn" onclick="window.shiftWeek(-1)" aria-label="الأسبوع السابق">›</button><div style="text-align:center"><h2 style="margin:0;font-size:18px">الأسبوع</h2><div class="subtle">${label}</div></div><button class="navbtn" onclick="window.shiftWeek(1)" aria-label="الأسبوع التالي">‹</button></div><div class="week-grid">${ds.map(d=>{let k=key(d),a=active(state.habits,k),n=a.filter(h=>done(h.id,k)).length,r=a.length?n/a.length:0;return `<button class="day-card ${key(d)===key(today())?'today':''} ${key(d)===key(focusDate)?'selected':''}" onclick="window.selectFocus('${k}')"><div class="day-name">${days[(d.getDay()+1)%7]}</div><div class="day-number">${num(d.getDate())}</div><div>${a.map(h=>`<i class="day-mark ${done(h.id,k)?'yes':''}" title="${esc(h.name)}"></i>`).join('')}</div><div class="day-ratio">${a.length?pct(r):'—'}</div></button>`}).join('')}</div>${focusBlock(focusDate)}`;$('mainPanel').innerHTML=html}
function renderMonth(){let first=new Date(monthAnchor.getFullYear(),monthAnchor.getMonth(),1),start=startWeek(first),last=new Date(monthAnchor.getFullYear(),monthAnchor.getMonth()+1,0),end=add(startWeek(last),6),ds=[];for(let d=start;d<=end;d=add(d,1))ds.push(d);let html=`<div class="month-nav"><button class="navbtn" onclick="window.shiftMonth(-1)" aria-label="الشهر السابق">›</button><h2 style="margin:0;font-size:18px">${fmt(monthAnchor,{month:'long',year:'numeric'})}</h2><button class="navbtn" onclick="window.shiftMonth(1)" aria-label="الشهر التالي">‹</button></div><div class="month-grid">${days.map(d=>`<div class="weekday">${d.slice(0,2)}</div>`).join('')}${ds.map(d=>{let k=key(d),r=dayRatio(k);return `<button class="month-day ${d.getMonth()!==monthAnchor.getMonth()?'outside':''} ${k===key(today())?'today':''} ${k===key(focusDate)?'selected':''}" onclick="window.selectFocus('${k}')"><span>${num(d.getDate())}</span><i class="tinybar ${r!==null&&r===1?'good':''}" style="opacity:${r===null?.35:.4+r*.6}"></i></button>`}).join('')}</div>${focusBlock(focusDate)}`;$('mainPanel').innerHTML=html}
function focusBlock(d){let k=key(d),a=active(state.habits,k),n=a.filter(h=>done(h.id,k)).length;return `<div class="focus-list"><div class="section-head"><div><h2>${fmt(d)}</h2><div class="subtle">إنجاز ${num(n)} من ${num(a.length)} عادات</div></div><span class="badge">${a.length?pct(n/a.length):'—'}</span></div>${a.length?a.map(h=>`<div class="focus-row"><span class="dot" style="height:27px;width:5px;background:${colors[h.color]||colors.cedar}"></span><span class="name">${esc(h.name)}</span><span class="badge">${done(h.id,k)?'منجزة':'لم تُنجز'}</span>${k<=key(today())?`<button class="icon-btn" onclick="window.toggleDone('${h.id}','${k}')">${done(h.id,k)?'↶':'✓'}</button>`:''}</div>`).join(''):'<p class="subtle">لا توجد عادات مسجلة في هذا التاريخ.</p>'}</div>`}
function renderStats(){let k=key(today()),a=active(state.habits,k),n=a.filter(h=>done(h.id,k)).length,r=a.length?n/a.length:0,comm=commitmentDates();let html=`<div class="stat stat-wide"><div class="stat-top"><span>إنجاز اليوم</span><span>◉</span></div><div class="stat-num">${pct(r)}</div><div class="stat-note">${num(n)} من ${num(a.length)} عادات مكتملة</div><div class="progress"><span style="width:${r*100}%"></span></div></div><div class="stat"><div class="stat-top"><span>سلسلة الالتزام</span><span>♨</span></div><div class="stat-num">${num(currentStreak())}</div><div class="stat-note">يوم متتالٍ</div></div><div class="stat"><div class="stat-top"><span>أفضل سلسلة</span><span>↗</span></div><div class="stat-num">${num(bestStreak(comm))}</div><div class="stat-note">يوم متتالٍ</div></div><div class="stat"><div class="stat-top"><span>العادات</span><span>♧</span></div><div class="stat-num">${num(state.habits.length)}</div><div class="stat-note">عادة نشطة</div></div><div class="stat"><div class="stat-top"><span>هذا الأسبوع</span><span>▦</span></div><div class="stat-num">${pct(weekDays(today()).reduce((s,d)=>s+(dayRatio(key(d))||0),0)/7)}</div><div class="stat-note">متوسط الإنجاز اليومي</div></div><div class="stat habit-stat-box"><div class="section-head"><h2 style="font-size:15px">حسب العادة</h2></div><div class="habit-stat-list">${state.habits.length?state.habits.map(h=>{let activeDays=Math.max(1,Math.round((today()-parse(h.createdAt))/86400000)+1),ds=daysDone(h).filter(x=>x<=k).length;return `<div class="habit-stat"><span class="mini" style="background:${colors[h.color]||colors.cedar}"></span><span>${esc(h.name)}</span><strong>${pct(Math.min(1,ds/activeDays))}</strong></div>`}).join(''):'<div class="subtle">أضف عادة لعرض إحصائياتها.</div>'}</div></div>`;$('stats').innerHTML=html}
function openForm(h=null){editing=h;chosenColor=h?.color||colorsOrder[state.habits.length%colorsOrder.length];$('modalTitle').textContent=h?'تعديل العادة':'إضافة عادة جديدة';$('habitName').value=h?.name||'';$('habitColor').value=chosenColor;$('deleteHabit').classList.toggle('hidden',!h);renderColors();$('modalBackdrop').classList.add('open');setTimeout(()=>$('habitName').focus(),80)}const colorsOrder=Object.keys(colors);function renderColors(){$('colors').innerHTML=colorsOrder.map(c=>`<button type="button" class="color-choice ${c===chosenColor?'selected':''}" title="${colorNames[c]}" aria-label="${colorNames[c]}" style="background:${colors[c]}" onclick="window.chooseColor('${c}')"></button>`).join('')}
function closeForm(){$('modalBackdrop').classList.remove('open');editing=null}function saveHabit(e){e.preventDefault();let name=$('habitName').value.trim();if(!name)return;let color=chosenColor;if(editing){editing.name=name;editing.color=color}else{let h={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,color,createdAt:key(today())};state.habits.push(h);state.logs[h.id]=[]}state.demo=false;save();closeForm();render();showToast(editing?'تم تحديث العادة':'تمت إضافة العادة')}
window.editHabit=id=>{let h=state.habits.find(x=>x.id===id);if(h)openForm(h)};window.chooseColor=c=>{chosenColor=c;$('habitColor').value=c;renderColors()};window.toggleDone=(id,k)=>{let h=state.habits.find(x=>x.id===id);if(!h)return;if(k>key(today()))return;state.logs[id]??=[];let i=state.logs[id].indexOf(k);if(i>=0)state.logs[id].splice(i,1);else state.logs[id].push(k);state.logs[id].sort();save();render()};window.shiftWeek=n=>{weekAnchor=add(weekAnchor,n*7);render()};window.shiftMonth=n=>{monthAnchor=new Date(monthAnchor.getFullYear(),monthAnchor.getMonth()+n,1);render()};window.selectFocus=k=>{focusDate=parse(k);if(view==='week')weekAnchor=focusDate;if(view==='month')monthAnchor=focusDate;render()};
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));$('addBtn').addEventListener('click',()=>openForm());$('cancelModal').addEventListener('click',closeForm);$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeForm()});$('habitForm').addEventListener('submit',saveHabit);$('deleteHabit').addEventListener('click',()=>{if(!editing)return;if(confirm(`هل تريد حذف عادة «${editing.name}» وكل سجل إنجازاتها؟`)){state.habits=state.habits.filter(h=>h.id!==editing.id);delete state.logs[editing.id];save();closeForm();render();showToast('تم حذف العادة')}});$('clearDemo').addEventListener('click',()=>{if(confirm('مسح العادات التجريبية وسجلاتها؟')){state={habits:[],logs:{},demo:false};save();render();showToast('تم مسح الأمثلة')}});$('keepDemo').addEventListener('click',()=>{state.demo=false;save();render();showToast('تم الاحتفاظ بالبيانات')});$('resetBtn').addEventListener('click',()=>{if(confirm('سيتم حذف كل العادات وسجلات الإنجاز المحفوظة على هذا الجهاز. هل تريد المتابعة؟')){state={habits:[],logs:{},demo:false};save();render();showToast('تم مسح البيانات')}});$('exportBtn').addEventListener('click',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`thabat-backup-${key(today())}.json`;a.click();URL.revokeObjectURL(url);showToast('تم تجهيز النسخة الاحتياطية')});$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.habits)||!x.logs||typeof x.logs!=='object')throw Error();if(!confirm('سيتم استبدال البيانات الحالية بالبيانات المستوردة. متابعة؟'))return;state={habits:x.habits,logs:x.logs,demo:!!x.demo};save();render();showToast('تم استيراد البيانات بنجاح')}catch(err){alert('الملف غير صالح أو لا يحتوي على بيانات ثبات.')}finally{e.target.value=''}});
// Start with a clean workspace; the user can add habits immediately.
render();
})();
